[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "specforge-decoding"
version = "1.0.0"
description = "Distilled speculative decoding with rollback-capable KV caches"
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = [
    "torch>=2.4,<3",
    "matplotlib>=3.8,<4",
]

[project.optional-dependencies]
hf = [
    "transformers>=4.51,<6",
    "accelerate>=1.0,<2",
    "safetensors>=0.4,<1",
    "sentencepiece>=0.2,<1",
    "modelscope>=1.30,<2",
]

[tool.setuptools.packages.find]
include = ["specforge*"]
